site_name: pygeofilter AERONET API support for CQL2
site_url: https://terradue.github.io/pygeofilter-aeronet/
site_author: Fabrice Brito, Simone Tripodi
repo_url: https://github.com/Terradue/pygeofilter-aeronet
repo_name: Terradue/pygeofilter-aeronet

theme:
    logo: imgs/icon-eoap.png
    name: readthedocs

    palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

plugins:
  - search
  - mermaid2:
      version: 11.4.1
  - mkdocs-jupyter:
      execute: false
      show_input: True
      no_input: False
  - build_plantuml:
      render: 'server' # or "local" for local rendering
      disable_ssl_certificate_validation: true # for self-signed and invalid certs
      output_format: 'svg'
      allow_multiple_roots: false # in case your codebase contains more locations for diagrams (all ending in diagram_root)
      diagram_root: 'docs/diagrams' # should reside under docs_dir
      input_folder: 'src'
      output_folder: 'out'
      theme_enabled: true
      theme_folder: "include/themes"
      theme_light: "light.puml"
      theme_dark: "dark.puml"

markdown_extensions:
  - pymdownx.details
  - abbr
  - admonition
  - footnotes
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - attr_list
  - pymdownx.snippets:
      base_path: './'
  - pymdownx.highlight:
      line_spans: __span

extra_css:
  - styles/css/app.css
  
extra_javascript:
  - javascripts/config.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Tutorials:
    - Overview: tutorials/index.md
    - Your first query: tutorials/first-query.md
    - Translate a filter: tutorials/filter-translation.ipynb
    - Retrieve and map Level 1.0 AOD: samples/level_10.ipynb
  - How-to guides:
    - Overview: how-to/index.md
    - CLI workflows: how-to/cli.md
    - Level 1.5 AOD: samples/level_15.ipynb
    - Level 2.0 AOD: samples/level_20_aod.ipynb
    - Level 2.0 SDA: samples/level_20_sda.ipynb
    - Geographic search: samples/geo_search.ipynb
    - Discover stations: use_cases/stations.ipynb
    - Satellite matchup: use_cases/matchup.ipynb
    - Station-first matchup: use_cases/stations_matchup.ipynb
    - Development and documentation: how-to/development.md
  - Reference:
    - Overview: reference/index.md
    - CLI: cli.md
    - Filters: reference/filters.md
    - Python API: reference/python.md
    - AERONET OpenAPI: aeronet_openapi.html
  - Explanation:
    - Query processing: explanation/index.md
    - Software design: design.md

copyright: <a href="https://www.apache.org/licenses/LICENSE-2.0"><img src="https://img.shields.io/badge/license-Apache%20License%202.0-blue"" alt="Apache License, Version 2.0" /></a>
